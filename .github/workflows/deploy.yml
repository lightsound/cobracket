name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time, and never cancel one midway: `spacetime
# publish` pushes the module and `cf deploy` uploads assets, so an
# interrupted run can leave the two halves on different revisions.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Named `gates`, not `verify`, so it does not collide with the check
  # `ci.yml` publishes on pull requests: check runs are identified by job
  # name, and `verify` there is the one a branch ruleset requires.
  gates:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun run check:bun -- --strict
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # Named `e2e-gate`, not `e2e`, for the same reason the job above is
  # `gates`, not `verify`: check runs are identified by job name, and
  # ci.yml's `e2e` is the pull-request one.
  e2e-gate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun run check:bun -- --strict
      - run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: e2e-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: spacetimedb/.e2e-build/bin
          key: e2e-${{ runner.os }}-spacetimedb-2.15.0
      - run: bun x playwright-core install chromium
      - run: bun run test:e2e

  preflight:
    runs-on: ubuntu-26.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          for name in SPACETIMEDB_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped (production secrets not set)::Secrets not set: ${missing[*]}. Nothing to fix — see AGENTS.md, '## Production deployment'. Setting them under Settings > Secrets and variables > Actions is what starts deploying."
            echo "**Deploy skipped** — repository secrets unset: \`${missing[*]}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: [gates, preflight, e2e-gate]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Install the SpacetimeDB CLI (pinned, checksum-verified)
        run: |
          asset="spacetime-x86_64-unknown-linux-gnu.tar.gz"
          curl -fSL -o "/tmp/$asset" "https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.15.0/$asset"
          echo "30ee1d0ad345eb479bc269423f1c0f2f21fc564cd634fcb115c248465358b062  /tmp/$asset" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf "/tmp/$asset" -C "$HOME/.local/bin" --no-same-owner
          mv "$HOME/.local/bin/spacetimedb-cli" "$HOME/.local/bin/spacetime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          [[ "$("$HOME/.local/bin/spacetime" --version)" == *"2.15.0"* ]]

      - name: Log in to SpacetimeDB as the production owner
        run: spacetime login --token "$SPACETIMEDB_TOKEN"
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}

      - name: Publish the SpacetimeDB module and build the web UI
        run: bun run deploy:backend

      - name: Deploy the web UI
        run: bun run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SEND_TELEMETRY: "false"
