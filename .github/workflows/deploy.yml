name: Deploy

# Continuous deployment to production (ADR 0010): every push to main runs the
# repository's gates and then, only if they pass, deploys the Convex functions
# and the static web UI.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time, and never cancel one midway: `convex deploy`
# pushes functions and `wrangler deploy` uploads assets, so an interrupted run
# can leave the two halves on different revisions.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep the pre-release toolchain identical to local development (ADR 0004).
  # Keep in sync with `packageManager` in package.json.
  BUN_VERSION: 1.4.0

jobs:
  # The same gates AGENTS.md asks a human to run before committing. They run
  # before anything touches the production deployment.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun x vp check
      - run: bun run lint:imports
      - run: bun run lint:solid
      - run: bun run lint:theme

  # Production needs three repository secrets (ADR 0010). Until a human sets
  # them, `deploy` is skipped rather than failed: main's status then reflects
  # the gates, the run carries a warning annotation naming what is missing,
  # and continuous deployment resumes on the next push once the secrets
  # exist, with no workflow edit. (The secrets context is not available in a
  # job-level `if`, hence the step that reads them into an output.)
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          for name in CONVEX_DEPLOY_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::Production secrets not set: ${missing[*]}. Set them under Settings > Secrets and variables > Actions (AGENTS.md, '## Production deployment')."
            echo "**Deploy skipped** — missing repository secrets: \`${missing[*]}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: [verify, preflight]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # Deploys convex/ to the deployment CONVEX_DEPLOY_KEY belongs to, and
      # runs the client build with VITE_CONVEX_URL set to that deployment's
      # URL. The build runs first, so a broken build aborts before any
      # function reaches production.
      - name: Deploy Convex functions and build the web UI
        run: bun run deploy:backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Uploads dist/client to the Worker declared in wrangler.jsonc. The
      # checkout has no .env.local, so wrangler cannot pick up a local
      # deployment URL as a Worker variable.
      - name: Deploy the web UI
        run: bun run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
