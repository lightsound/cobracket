name: Fallow

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@v3
        with:
          auto-changed-since: false
          fail-on-issues: true
          # Matches `.fallowrc.jsonc` `typeAware.enabled`. `auto` also
          # provisions the version-matched fallow-type-aware sidecar.
          type-aware: auto
          comment: true
          score: true
